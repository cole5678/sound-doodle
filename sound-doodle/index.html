<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Doodle</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #171a22;
    --panel-border: #2a2f3d;
    --text: #e8eaf0;
    --text-dim: #8790a3;
    --accent: #7c9cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
    flex-wrap: wrap;
    z-index: 10;
  }
  #title {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    margin-right: 6px;
    white-space: nowrap;
  }
  #title span { color: var(--text-dim); font-weight: 400; }
  .swatches {
    display: flex;
    gap: 8px;
  }
  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
    padding: 0;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active {
    border-color: #fff;
    transform: scale(1.15);
  }
  .divider {
    width: 1px;
    height: 24px;
    background: var(--panel-border);
  }
  button.action {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.12s ease, border-color 0.12s ease;
    white-space: nowrap;
  }
  button.action:hover {
    background: #1f2330;
    border-color: var(--accent);
  }
  button.action:active { transform: translateY(1px); }
  button.action:disabled {
    opacity: 0.4;
    cursor: default;
  }
  #spacer { flex: 1; }
  .hint {
    color: var(--text-dim);
    font-size: 12px;
    white-space: nowrap;
  }
  #canvasWrap {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  #startOverlay {
    position: absolute;
    inset: 0;
    background: rgba(13,15,20,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #startOverlay h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 600;
  }
  #startOverlay p {
    color: var(--text-dim);
    margin: 0;
    max-width: 360px;
    font-size: 14px;
    line-height: 1.5;
  }
  #startBtn {
    background: var(--accent);
    color: #0d0f14;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
  }
  #startBtn:hover { filter: brightness(1.08); }
  input[type="range"] {
    width: 80px;
    accent-color: var(--accent);
  }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div id="title">Sound Doodle <span>— draw and listen</span></div>
    <div class="swatches" id="swatches"></div>
    <div class="divider"></div>
    <label class="hint" for="volume">volume</label>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.6">
    <div class="divider"></div>
    <button class="action" id="replayBtn">▶ Replay</button>
    <button class="action" id="clearBtn">Clear</button>
    <div id="spacer"></div>
    <div class="hint">draw anywhere — pitch rises as you go up, tone changes by color</div>
  </div>
  <div id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div id="startOverlay">
      <h1>Sound Doodle</h1>
      <p>Pick a color, then draw. Height controls pitch, left-right controls stereo pan, and each color has its own instrument timbre. Hit Replay to watch and hear your drawing again.</p>
      <button id="startBtn">Start drawing</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const swatchesEl = document.getElementById('swatches');
  const replayBtn = document.getElementById('replayBtn');
  const clearBtn = document.getElementById('clearBtn');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const volumeSlider = document.getElementById('volume');

  // ---- Color / instrument palette ----
  const PALETTE = [
    { name: 'coral',   color: '#ff6b6b', wave: 'sine' },
    { name: 'amber',   color: '#ffb84d', wave: 'triangle' },
    { name: 'mint',    color: '#4de6a8', wave: 'sine' },
    { name: 'sky',     color: '#4dc3ff', wave: 'sawtooth' },
    { name: 'violet',  color: '#b088ff', wave: 'square' },
    { name: 'blush',   color: '#ff8fd4', wave: 'triangle' },
  ];
  let activeIdx = 0;

  PALETTE.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (i === 0 ? ' active' : '');
    b.style.background = p.color;
    b.title = p.name;
    b.addEventListener('click', () => {
      activeIdx = i;
      [...swatchesEl.children].forEach((c, ci) => c.classList.toggle('active', ci === i));
    });
    swatchesEl.appendChild(b);
  });

  // ---- Canvas sizing ----
  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawAll();
  }
  window.addEventListener('resize', resizeCanvas);

  // ---- Audio ----
  let audioCtx = null;
  let masterGain = null;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = parseFloat(volumeSlider.value);
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  volumeSlider.addEventListener('input', () => {
    if (masterGain) masterGain.gain.value = parseFloat(volumeSlider.value);
  });

  // Pentatonic scale across ~3 octaves for consistently pleasant notes
  const BASE_SCALE = [0, 2, 4, 7, 9]; // major pentatonic intervals
  const ROOT = 220; // A3
  function freqForSemitone(semi) {
    return ROOT * Math.pow(2, semi / 12);
  }
  const SCALE_FREQS = (() => {
    const freqs = [];
    for (let octave = -1; octave <= 2; octave++) {
      BASE_SCALE.forEach(interval => freqs.push(freqForSemitone(interval + octave * 12)));
    }
    return freqs.sort((a, b) => a - b);
  })();

  function yToFreq(y, height) {
    const t = Math.max(0, Math.min(1, 1 - y / height));
    const idx = Math.floor(t * (SCALE_FREQS.length - 1));
    return SCALE_FREQS[idx];
  }

  let lastNoteTime = 0;
  function playNote(freq, wave, pan, velocity) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    // light throttle so fast drawing doesn't clip into a buzz
    if (now - lastNoteTime < 0.035) return;
    lastNoteTime = now;

    const osc = audioCtx.createOscillator();
    osc.type = wave;
    osc.frequency.value = freq;

    const gain = audioCtx.createGain();
    const peak = 0.18 * Math.max(0.25, Math.min(1, velocity));
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(peak, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

    const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    osc.connect(gain);
    if (panner) {
      panner.pan.value = pan;
      gain.connect(panner);
      panner.connect(masterGain);
    } else {
      gain.connect(masterGain);
    }

    osc.start(now);
    osc.stop(now + 0.34);
  }

  // ---- Drawing state ----
  let strokes = [];       // finished + in-progress strokes: {paletteIdx, points:[{x,y,t}]}
  let currentStroke = null;
  let drawing = false;
  let startTime = 0;

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx, y: cy };
  }

  function beginStroke(e) {
    ensureAudio();
    drawing = true;
    if (strokes.length === 0) startTime = performance.now();
    const { x, y } = pointerPos(e);
    currentStroke = { paletteIdx: activeIdx, points: [{ x, y, t: performance.now() - startTime }] };
    strokes.push(currentStroke);
    replayBtn.disabled = false;
  }

  function extendStroke(e) {
    if (!drawing || !currentStroke) return;
    const { x, y } = pointerPos(e);
    const pts = currentStroke.points;
    const prev = pts[pts.length - 1];
    const dx = x - prev.x, dy = y - prev.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 2) return; // avoid overly dense sampling

    const t = performance.now() - startTime;
    pts.push({ x, y, t });

    const p = PALETTE[currentStroke.paletteIdx];
    drawSegment(prev, { x, y }, p.color);

    const rect = canvas.getBoundingClientRect();
    const freq = yToFreq(y, rect.height);
    const pan = Math.max(-1, Math.min(1, (x / rect.width) * 2 - 1));
    const velocity = Math.min(1, dist / 40);
    playNote(freq, p.wave, pan, velocity);
  }

  function endStroke() {
    drawing = false;
    currentStroke = null;
  }

  function drawSegment(a, b, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function redrawAll() {
    const rect = wrap.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    strokes.forEach(s => {
      const color = PALETTE[s.paletteIdx].color;
      for (let i = 1; i < s.points.length; i++) {
        drawSegment(s.points[i - 1], s.points[i], color);
      }
    });
  }

  canvas.addEventListener('mousedown', beginStroke);
  canvas.addEventListener('mousemove', extendStroke);
  window.addEventListener('mouseup', endStroke);

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); beginStroke(e); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); extendStroke(e); }, { passive: false });
  canvas.addEventListener('touchend', (e) => { e.preventDefault(); endStroke(); }, { passive: false });

  // ---- Replay ----
  let replayTimeouts = [];
  let replaying = false;
  function stopReplay() {
    replayTimeouts.forEach(id => clearTimeout(id));
    replayTimeouts = [];
    replaying = false;
    replayBtn.disabled = strokes.length === 0;
  }

  // ---- Clear ----
  clearBtn.addEventListener('click', () => {
    stopReplay(); // cancel any in-flight replay (sound + scheduled draws) first
    strokes = [];
    currentStroke = null;
    redrawAll();
    replayBtn.disabled = true;
  });

  replayBtn.addEventListener('click', () => {
    if (strokes.length === 0 || replaying) return;
    ensureAudio();
    redrawAll(); // reset visual, we'll redraw progressively... actually keep static drawing visible, just replay sound + flash
    replaying = true;
    replayBtn.disabled = true;

    // Flatten all points across strokes into a single timeline of "events"
    const events = [];
    strokes.forEach(s => {
      const color = PALETTE[s.paletteIdx];
      for (let i = 1; i < s.points.length; i++) {
        events.push({
          t: s.points[i].t,
          a: s.points[i - 1],
          b: s.points[i],
          color: color.color,
          wave: color.wave,
        });
      }
    });
    events.sort((a, b) => a.t - b.t);
    if (events.length === 0) {
      replaying = false;
      replayBtn.disabled = false;
      return;
    }

    const rect = canvas.getBoundingClientRect();
    const maxT = events[events.length - 1].t;

    events.forEach(ev => {
      const id = setTimeout(() => {
        // brief highlight pulse on the segment
        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.moveTo(ev.a.x, ev.a.y);
        ctx.lineTo(ev.b.x, ev.b.y);
        ctx.stroke();
        ctx.restore();
        const drawId = setTimeout(() => drawSegment(ev.a, ev.b, ev.color), 90);
        replayTimeouts.push(drawId);

        const freq = yToFreq(ev.b.y, rect.height);
        const pan = Math.max(-1, Math.min(1, (ev.b.x / rect.width) * 2 - 1));
        playNote(freq, ev.wave, pan, 0.8);
      }, ev.t);
      replayTimeouts.push(id);
    });

    const doneId = setTimeout(() => {
      redrawAll();
      replaying = false;
      replayBtn.disabled = false;
    }, maxT + 400);
    replayTimeouts.push(doneId);
  });

  // ---- Start overlay ----
  startBtn.addEventListener('click', () => {
    ensureAudio();
    startOverlay.style.display = 'none';
  });

  replayBtn.disabled = true;

  // init
  resizeCanvas();
})();
</script>
</body>
</html>
